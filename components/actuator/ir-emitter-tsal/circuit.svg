<svg viewBox="0 0 700 470" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <title>IR LED 5V BJT 驅動線路圖 (TSAL6100/6200 + MMBT3904)</title>
  <desc>TSAL6100/6200 紅外 LED 由 MMBT3904 (SOT-23) NPN 低端開關驅動。5V 電源，R1=39ohm 1/2W through-hole 限流、R2=220ohm 0603 基極電阻。SIG 為 3.3V active-high 邏輯輸入，HIGH 時發射。脈衝/調制專用。右側為 SOT-23 頂視腳位參考：Pin1=Base, Pin2=Emitter, Pin3=Collector。</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="470" fill="#ffffff"/>
  <g stroke="#1f2933" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- rails -->
    <line x1="60" y1="70" x2="300" y2="70"/>
    <line x1="60" y1="410" x2="300" y2="410"/>
    <!-- collector branch: 5V -> R1 -> LED -> collector -->
    <line x1="300" y1="70" x2="300" y2="95"/>
    <polyline points="300,95 300,100 312,106 288,114 312,122 288,130 312,138 288,146 300,152 300,158"/>
    <line x1="300" y1="158" x2="300" y2="180"/>
    <polygon points="285,180 315,180 300,212" fill="#1f2933"/>
    <line x1="283" y1="214" x2="317" y2="214"/>
    <line x1="300" y1="214" x2="300" y2="252"/>
    <line x1="320" y1="198" x2="338" y2="184" marker-end="url(#arw)"/>
    <line x1="326" y1="206" x2="344" y2="192" marker-end="url(#arw)"/>
    <!-- transistor NPN -->
    <circle cx="285" cy="290" r="42" stroke-width="1.5"/>
    <line x1="270" y1="266" x2="270" y2="314"/>
    <line x1="210" y1="290" x2="270" y2="290"/>
    <line x1="270" y1="276" x2="300" y2="252"/>
    <line x1="270" y1="304" x2="300" y2="328" marker-end="url(#arw)"/>
    <line x1="300" y1="328" x2="300" y2="410"/>
    <!-- base branch: SIG -> R2 -> base -->
    <line x1="60" y1="290" x2="140" y2="290"/>
    <polyline points="140,290 148,290 154,278 166,302 178,278 190,302 202,290 210,290"/>
    <!-- terminal dots -->
    <circle cx="60" cy="70" r="4" fill="#1f2933"/>
    <circle cx="60" cy="290" r="4" fill="#1f2933"/>
    <circle cx="60" cy="410" r="4" fill="#1f2933"/>
  </g>
  <!-- labels -->
  <g fill="#1f2933" font-size="14" font-weight="bold">
    <text x="56" y="60">VCC 5 V</text>
    <text x="56" y="282">SIG 3.3 V</text>
    <text x="56" y="432">GND</text>
    <text x="354" y="196">IR LED</text>
    <text x="150" y="372">Q1  MMBT3904</text>
  </g>
  <g fill="#2563eb" font-size="14" font-weight="bold">
    <text x="326" y="124">R1  39 Ω</text>
    <text x="116" y="324">R2  220 Ω</text>
  </g>
  <g fill="#6b7280" font-size="12">
    <text x="326" y="142">1/2 W · through-hole</text>
    <text x="354" y="214">TSAL6100 / 6200</text>
    <text x="116" y="342">0603</text>
    <text x="150" y="390">NPN · SOT-23 · = 2N3904</text>
    <text x="326" y="402">脈衝/調制專用 · SIG 勿長期 HIGH</text>
  </g>
  <!-- SOT-23 pinout inset -->
  <rect x="430" y="70" width="240" height="320" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="550" y="100" text-anchor="middle" fill="#1f2933" font-size="15" font-weight="bold">SOT-23 頂視 (top view)</text>
  <text x="550" y="120" text-anchor="middle" fill="#6b7280" font-size="12">MMBT3904 / MMBT3906</text>
  <g stroke="#1f2933" stroke-width="2" fill="none" stroke-linecap="round">
    <rect x="505" y="180" width="90" height="60" rx="4" fill="#ffffff"/>
    <line x1="550" y1="180" x2="550" y2="158"/>
    <rect x="540" y="146" width="20" height="14" rx="2" fill="#1f2933"/>
    <line x1="525" y1="240" x2="525" y2="262"/>
    <rect x="515" y="262" width="20" height="14" rx="2" fill="#1f2933"/>
    <line x1="575" y1="240" x2="575" y2="262"/>
    <rect x="565" y="262" width="20" height="14" rx="2" fill="#1f2933"/>
  </g>
  <text x="550" y="156" text-anchor="middle" fill="#ffffff" font-size="11">3</text>
  <text x="525" y="273" text-anchor="middle" fill="#ffffff" font-size="11">1</text>
  <text x="575" y="273" text-anchor="middle" fill="#ffffff" font-size="11">2</text>
  <g fill="#1f2933" font-size="14" font-weight="bold">
    <text x="450" y="320">Pin 3 = C  (Collector)</text>
    <text x="450" y="342">Pin 1 = B  (Base)</text>
    <text x="450" y="364">Pin 2 = E  (Emitter)</text>
  </g>
</svg>
